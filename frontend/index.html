<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Task App</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; }
    .container { max-width: 760px; margin: 50px auto; padding: 24px; }
    .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 10px; margin-bottom: 22px; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; }
    .add { background: #2563eb; color: #fff; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    li:last-child { border-bottom: 0; }
    .title { flex: 1; }
    .done { text-decoration: line-through; color: #6b7280; }
    .delete { background: #ef4444; color: white; }
    .status { margin-bottom: 18px; font-size: 14px; color: #4b5563; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>DevOps Task App</h1>
      <div id="status" class="status">Checking backend...</div>
      <form id="task-form">
        <input id="task-title" type="text" placeholder="Enter a task" required maxlength="255" />
        <button class="add" type="submit">Add Task</button>
      </form>
      <ul id="task-list"></ul>
    </div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-title');
    const list = document.getElementById('task-list');

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderTasks(tasks) {
      list.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.completed);
        checkbox.addEventListener('change', async () => {
          try {
            await api(`/api/tasks/${task.id}`, {
              method: 'PUT',
              body: JSON.stringify({ completed: checkbox.checked })
            });
            await loadTasks();
          } catch (error) {
            statusEl.textContent = error.message;
            statusEl.className = 'status error';
            checkbox.checked = !checkbox.checked;
          }
        });

        const title = document.createElement('span');
        title.className = `title ${task.completed ? 'done' : ''}`;
        title.textContent = task.title;

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete';
        deleteButton.textContent = 'Delete';
        deleteButton.addEventListener('click', async () => {
          try {
            await api(`/api/tasks/${task.id}`, { method: 'DELETE' });
            await loadTasks();
          } catch (error) {
            statusEl.textContent = error.message;
            statusEl.className = 'status error';
          }
        });

        li.append(checkbox, title, deleteButton);
        list.appendChild(li);
      });
    }

    async function loadTasks() {
      const tasks = await api('/api/tasks');
      renderTasks(tasks);
      statusEl.textContent = `Backend connected · ${tasks.length} task(s)`;
      statusEl.className = 'status';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      try {
        await api('/api/tasks', {
          method: 'POST',
          body: JSON.stringify({ title })
        });
        input.value = '';
        await loadTasks();
      } catch (error) {
        statusEl.textContent = error.message;
        statusEl.className = 'status error';
      }
    });

    loadTasks().catch(error => {
      statusEl.textContent = `Backend unavailable: ${error.message}`;
      statusEl.className = 'status error';
    });
  </script>
</body>
</html>
